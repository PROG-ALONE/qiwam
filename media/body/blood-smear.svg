<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" font-family="IBM Plex Sans Arabic, sans-serif">
  <!-- رسم تخطيطي أصلي لقِوام: عيّنة دم مبسّطة. خلايا حمراء سليمة (أقراص مقعّرة) وخلية منجلية. -->
  <rect width="420" height="240" rx="16" fill="#fbeff0"/>
  <g fill="#c0392b"><circle cx="60" cy="60" r="24"/><circle cx="150" cy="190" r="24"/><circle cx="350" cy="56" r="24"/><circle cx="300" cy="190" r="22"/><circle cx="210" cy="40" r="20"/></g>
  <g fill="#e8968c"><circle cx="60" cy="60" r="11"/><circle cx="150" cy="190" r="11"/><circle cx="350" cy="56" r="11"/><circle cx="300" cy="190" r="10"/><circle cx="210" cy="40" r="9"/></g>
  <!-- أ: خلية سليمة -->
  <g><circle cx="90" cy="130" r="28" fill="#c0392b"/><circle cx="90" cy="130" r="13" fill="#e8968c"/></g>
  <!-- ب: خلية منجلية -->
  <path d="M-40 0 Q0 -55 40 0 Q0 -22 -40 0 Z" transform="translate(220 140) rotate(-12)" fill="#c0392b" stroke="#8e2a20" stroke-width="1.5"/>
  <!-- ج: خلية سليمة من الجانب -->
  <g><ellipse cx="350" cy="130" rx="11" ry="32" fill="#c0392b"/><ellipse cx="350" cy="130" rx="4" ry="13" fill="#e8968c"/></g>
  <g font-size="22" font-weight="700" fill="#14202c" text-anchor="middle">
    <circle cx="90" cy="84" r="14" fill="#fff" stroke="#14202c"/><text x="90" y="92">أ</text>
    <circle cx="220" cy="84" r="14" fill="#fff" stroke="#14202c"/><text x="220" y="92">ب</text>
    <circle cx="378" cy="96" r="14" fill="#fff" stroke="#14202c"/><text x="378" y="104">ج</text>
  </g>
</svg>
